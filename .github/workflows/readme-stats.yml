name: Update README stats

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

env:
  THEME: bg_color=135,30363d,0d1117&title_color=58a6ff&text_color=c9d1d9&icon_color=58a6ff&hide_border=true

jobs:
  cards:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stats
            card: stats
            options: include_all_commits=true&count_private=true&show_icons=true&hide=prs&ring_color=58a6ff
          - { name: pin-libpybee, card: pin, options: repo=libpybee }
          - { name: pin-youtube_release_tracker, card: pin, options: repo=youtube_release_tracker }
          - { name: pin-music-charts, card: pin, options: repo=music-charts }
          - { name: pin-esports-data-hub, card: pin, options: repo=esports-data-hub }
          - { name: pin-liquipydia, card: pin, options: repo=liquipydia }
          - { name: pin-liquipedia-editing-toolkit, card: pin, options: repo=liquipedia-editing-toolkit }
    steps:
      - uses: actions/checkout@v7

      - name: Generate ${{ matrix.name }}
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: ${{ matrix.card }}
          options: username=Dyl-M&${{ matrix.options }}&${{ env.THEME }}
          path: profile/${{ matrix.name }}.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v7
        with:
          name: card-${{ matrix.name }}
          path: profile/${{ matrix.name }}.svg

  commit:
    needs: cards
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: card-*
          merge-multiple: true
          path: profile

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README stats" || exit 0
          git push
